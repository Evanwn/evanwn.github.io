<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Photo Clipboard Copier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .upload-container {
            background-color: #fff;
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            margin-bottom: 30px;
        }

        .upload-container:hover {
            background-color: #ebf5fb;
            border-color: #2980b9;
        }

        .upload-container p {
            margin: 0;
            font-size: 1.2rem;
            color: #555;
        }

        #file-input {
            display: none;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .photo-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .photo-index {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .photo-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .copy-btn {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: #2980b9;
        }

        .copy-btn.copied {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <h1>📸 Bulk Photo Clipboard Copier</h1>
    
    <div class="upload-container" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <p>Tap here to select a ton of photos</p>
        <input type="file" id="file-input" multiple accept="image/*">
    </div>

    <div class="gallery-grid" id="gallery"></div>

    <script>
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');
        let imageCounter = 1;

        fileInput.addEventListener('change', handleFiles);

        async function handleFiles(e) {
            const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
            
            for (const file of files) {
                try {
                    const dataUrl = await readFileAsDataURL(file);
                    createPhotoCard(dataUrl, file, imageCounter++);
                } catch (err) {
                    console.error("Error reading file:", err);
                }
            }
            fileInput.value = ''; 
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => resolve(event.target.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function createPhotoCard(imageSrc, fileBlob, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';

            const indexLabel = document.createElement('span');
            indexLabel.className = 'photo-index';
            indexLabel.innerText = `#${index}`;

            const img = document.createElement('img');
            img.src = imageSrc;

            const button = document.createElement('button');
            button.className = 'copy-btn';
            button.innerText = 'Copy Image';

            button.addEventListener('click', async () => {
                // Double check if browser supports clipboard natively
                if (!navigator.clipboard || !window.ClipboardItem) {
                    alert('Your mobile browser is blocking clipboard access. Try opening this link directly inside Google Chrome instead of an in-app browser.');
                    return;
                }

                try {
                    // Modern direct blob clipboard writing
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            [fileBlob.type]: fileBlob
                        })
                    ]);
                    
                    button.innerText = '✓ Copied!';
                    button.classList.add('copied');
                    
                    setTimeout(() => {
                        button.innerText = 'Copy Image';
                        button.classList.remove('copied');
                    }, 1500);

                } catch (err) {
                    console.error('Clipboard error details:', err);
                    alert('Failed to copy. Make sure you granted clipboard permissions to Chrome.');
                }
            });

            card.appendChild(indexLabel);
            card.appendChild(img);
            card.appendChild(button);
            gallery.appendChild(card);
        }
    </script>
</body>
</html>
