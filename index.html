<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kuis ASAT Matematika Kelas 5 SD | Kubus & Balok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #eef4fa 0%, #dce3ed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.15);
            padding: 2.5rem 2rem;
            border: 2px solid #a6c1e0;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a3a5c;
            margin-bottom: 0.5rem;
            background: #d9e9ff;
            padding: 0.8rem 1.4rem;
            border-radius: 100px;
        }
        h1 i {
            color: #2b5b8c;
            font-size: 2.2rem;
        }

        .subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 15px;
            background: #e7f0fb;
            border-radius: 30px;
            padding: 0.8rem 1.8rem;
            color: #1e3b5a;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .progress-badge {
            background: #2b5b8c;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
        }

        .questions-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 1.8rem 0 2.5rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid #c9daea;
            border-radius: 32px;
            padding: 1.4rem 1.8rem;
            box-shadow: 0 10px 18px -10px rgba(30, 60, 100, 0.1);
            transition: all 0.2s ease;
            border-left: 10px solid #5884b9;
        }
        .question-card:hover {
            border-left-color: #2b5b8c;
            box-shadow: 0 16px 24px -10px rgba(20, 50, 90, 0.18);
        }

        .question-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 1.2rem;
        }
        .q-num {
            background: #4f7299;
            color: white;
            font-weight: 700;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.2rem;
        }
        .q-text {
            font-weight: 650;
            font-size: 1.18rem;
            color: #142b42;
            flex: 1;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 5px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 16px;
            background: #f4f8fd;
            transition: background 0.15s;
            cursor: pointer;
            border: 1px solid #cbddec;
        }
        .option-item:hover {
            background: #e1ecf9;
        }
        .option-item input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #4a6e93;
            border-radius: 50%;
            margin: 0;
            display: grid;
            place-content: center;
            cursor: pointer;
            background: white;
        }
        .option-item input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 0.15s transform;
            box-shadow: inset 1em 1em #1f5080;
        }
        .option-item input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            margin-top: 15px;
        }
        .btn {
            border: none;
            background: #2b5b8c;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 18px -6px #1b3f5e;
            border: 1px solid #5682b0;
        }
        .btn:hover {
            background: #1a3f60;
        }
        .btn-outline {
            background: transparent;
            color: #1e3b5a;
            border: 2px solid #5884b9;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #e7f0fb;
        }

        .result-panel {
            margin-top: 2.2rem;
            background: #f0f6fe;
            border-radius: 36px;
            padding: 1.6rem 2rem;
            border: 2px dashed #6d93c2;
        }
        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #153b5c;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .analysis-box {
            background: #ffffff;
            border-radius: 28px;
            padding: 1.4rem;
            margin-top: 1.6rem;
            border: 1px solid #b6ceef;
        }
        .topic-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted #a3bbd9;
        }
        .topic-item:last-child {
            border-bottom: none;
        }
        .weak-tag {
            background: #f9cdb5;
            color: #632c0b;
            border-radius: 25px;
            padding: 4px 18px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .good-tag {
            background: #b7d9ae;
            color: #1e4a17;
            border-radius: 25px;
            padding: 4px 18px;
        }
        hr {
            border: 1px solid #cddef5;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>
            <i class="fas fa-cube"></i> Kuis Kubus & Balok
        </h1>
        <div class="subtitle">
            <span><i class="fas fa-cubes"></i> Bangun Ruang • Kelas 5 SD</span>
            <span class="progress-badge"><i class="far fa-clock"></i> 20 Soal Pilihan Ganda</span>
        </div>

        <form id="quizForm">
            <div class="questions-wrapper" id="questionsContainer"></div>
            <div class="btn-group">
                <button type="button" class="btn" id="submitBtn"><i class="fas fa-check-circle"></i> Kumpulkan & Lihat Skor</button>
                <button type="button" class="btn btn-outline" id="resetBtn"><i class="fas fa-redo-alt"></i> Ulangi Kuis</button>
            </div>
        </form>

        <div id="resultPanel" class="result-panel" style="display: none;">
            <div class="score-display" id="scoreText"></div>
            <div class="analysis-box" id="analysisContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // BANK SOAL KHUSUS KUBUS DAN BALOK (20 soal)
            const questions = [
                {   // 1
                    text: "Bangun ruang yang semua sisinya berbentuk persegi dan sama besar disebut …",
                    options: ["Balok", "Kubus", "Limas segi empat", "Prisma"],
                    correct: 1,
                    topic: "sifat-kubus"
                },
                {   // 2
                    text: "Jumlah rusuk pada sebuah kubus adalah …",
                    options: ["10", "12", "14", "16"],
                    correct: 1,
                    topic: "sifat-kubus"
                },
                {   // 3
                    text: "Volume kubus yang panjang rusuknya 6 cm adalah … cm³.",
                    options: ["216", "226", "246", "256"],
                    correct: 0,
                    topic: "volume-kubus"
                },
                {   // 4
                    text: "Balok memiliki … pasang sisi yang berhadapan sama besar.",
                    options: ["2", "3", "4", "5"],
                    correct: 1,
                    topic: "sifat-balok"
                },
                {   // 5
                    text: "Sebuah balok memiliki panjang 15 cm, lebar 7 cm, dan tinggi 11 cm. Volume balok tersebut adalah … cm³.",
                    options: ["1.155", "1.165", "1.255", "1.355"],
                    correct: 0,
                    topic: "volume-balok"
                },
                {   // 6
                    text: "Luas permukaan kubus dengan panjang rusuk 5 cm adalah … cm².",
                    options: ["100", "125", "150", "200"],
                    correct: 2,
                    topic: "luas-permukaan-kubus"
                },
                {   // 7
                    text: "Sebuah kubus memiliki volume 512 cm³. Panjang rusuk kubus tersebut adalah … cm.",
                    options: ["7", "8", "9", "10"],
                    correct: 1,
                    topic: "volume-kubus"
                },
                {   // 8
                    text: "Banyak titik sudut pada balok adalah …",
                    options: ["6", "8", "10", "12"],
                    correct: 1,
                    topic: "sifat-balok"
                },
                {   // 9
                    text: "Rumus untuk menghitung volume balok adalah …",
                    options: ["p × l", "p × l × t", "4 × p × l", "2 × (p + l + t)"],
                    correct: 1,
                    topic: "volume-balok"
                },
                {   // 10
                    text: "Perbedaan utama antara kubus dan balok terletak pada …",
                    options: ["Jumlah rusuk", "Jumlah sisi", "Bentuk sisi-sisinya", "Jumlah titik sudut"],
                    correct: 2,
                    topic: "sifat-kubus-dan-balok"
                },
                {   // 11
                    text: "Luas permukaan balok yang berukuran panjang 10 cm, lebar 4 cm, dan tinggi 6 cm adalah … cm².",
                    options: ["200", "240", "248", "280"],
                    correct: 2,
                    topic: "luas-permukaan-balok"
                },
                {   // 12
                    text: "Akuarium berbentuk balok memiliki volume 1.800 dm³. Jika panjangnya 15 dm dan lebarnya 10 dm, maka tingginya … dm.",
                    options: ["10", "12", "14", "15"],
                    correct: 1,
                    topic: "volume-balok"
                },
                {   // 13
                    text: "Sebuah kubus besar tersusun dari 27 kubus kecil berukuran rusuk 2 cm. Volume kubus besar adalah … cm³.",
                    options: ["54", "108", "216", "432"],
                    correct: 2,
                    topic: "volume-kubus"
                },
                {   // 14
                    text: "Berikut yang bukan jaring-jaring kubus adalah … (pilih yang salah)",
                    options: ["(gambar 1 benar)", "(gambar 2 benar)", "(gambar 3 benar)", "(gambar 4 tidak bisa membentuk kubus)"],
                    correct: 3,
                    topic: "jaring-jaring"
                },
                {   // 15
                    text: "Benda di sekitar kita yang menyerupai balok adalah …",
                    options: ["Bola basket", "Kotak sepatu", "Kaleng susu", "Topi ulang tahun"],
                    correct: 1,
                    topic: "aplikasi"
                },
                {   // 16
                    text: "Jika panjang rusuk sebuah kubus menjadi dua kali lipat, maka volumenya menjadi … kali semula.",
                    options: ["2", "4", "6", "8"],
                    correct: 3,
                    topic: "volume-kubus"
                },
                {   // 17
                    text: "Luas permukaan balok dengan panjang 20 cm, lebar 14 cm, dan tinggi 10 cm adalah … cm².",
                    options: ["1.000", "1.120", "1.240", "1.360"],
                    correct: 2,
                    topic: "luas-permukaan-balok"
                },
                {   // 18
                    text: "Sebuah kubus memiliki panjang rusuk 9 cm. Volume kubus tersebut adalah … cm³.",
                    options: ["81", "486", "729", "900"],
                    correct: 2,
                    topic: "volume-kubus"
                },
                {   // 19
                    text: "Balok dengan volume 120 cm³, panjang 8 cm, dan lebar 5 cm, maka tingginya … cm.",
                    options: ["2", "3", "4", "5"],
                    correct: 1,
                    topic: "volume-balok"
                },
                {   // 20
                    text: "Sebuah bak mandi berbentuk kubus dengan rusuk 80 cm. Volume air yang dapat ditampung adalah … liter. (1 dm³ = 1 liter)",
                    options: ["512", "480", "5120", "384"],
                    correct: 0,
                    topic: "soal-cerita"
                }
            ];

            // Pemetaan topik (hanya kubus & balok)
            const topicLabels = {
                "sifat-kubus": "Sifat Kubus",
                "sifat-balok": "Sifat Balok",
                "sifat-kubus-dan-balok": "Perbedaan Kubus & Balok",
                "volume-kubus": "Volume Kubus",
                "volume-balok": "Volume Balok",
                "luas-permukaan-kubus": "Luas Permukaan Kubus",
                "luas-permukaan-balok": "Luas Permukaan Balok",
                "jaring-jaring": "Jaring-jaring",
                "aplikasi": "Aplikasi",
                "soal-cerita": "Soal Cerita"
            };

            const container = document.getElementById('questionsContainer');
            function renderQuestions() {
                if (!container) return;
                let html = '';
                questions.forEach((q, idx) => {
                    html += `<div class="question-card" data-qindex="${idx}">`;
                    html += `<div class="question-header"><span class="q-num">${idx+1}</span><span class="q-text">${q.text}</span></div>`;
                    html += `<div class="options">`;
                    q.options.forEach((opt, optIdx) => {
                        html += `
                            <label class="option-item">
                                <input type="radio" name="q${idx}" value="${optIdx}">
                                <span>${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                            </label>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            }

            function calculateResults() {
                let correctCount = 0;
                const topicStats = {};

                questions.forEach(q => {
                    if (!topicStats[q.topic]) {
                        topicStats[q.topic] = { total: 0, correct: 0 };
                    }
                    topicStats[q.topic].total++;
                });

                const wrongDetails = [];
                for (let i = 0; i < questions.length; i++) {
                    const q = questions[i];
                    const selectedRadio = document.querySelector(`input[name="q${i}"]:checked`);
                    const isCorrect = selectedRadio && parseInt(selectedRadio.value, 10) === q.correct;

                    if (isCorrect) {
                        correctCount++;
                        topicStats[q.topic].correct++;
                    } else {
                        wrongDetails.push({
                            number: i+1,
                            topic: q.topic,
                            question: q.text,
                            correctAnswer: q.options[q.correct]
                        });
                    }
                }
                return { score: correctCount, total: questions.length, topicStats, wrongDetails };
            }

            function displayResults(results) {
                const resultPanel = document.getElementById('resultPanel');
                const scoreText = document.getElementById('scoreText');
                const analysisContent = document.getElementById('analysisContent');
                if (!resultPanel || !scoreText || !analysisContent) return;

                resultPanel.style.display = 'block';
                const percent = Math.round((results.score / results.total) * 100);
                scoreText.innerHTML = `📊 Skor Kamu: <span style="color:#1f5080;">${results.score}</span> / ${results.total}  (${percent}%)`;

                let analysisHtml = `<h3 style="margin-bottom:12px;color:#153b5c;"><i class="fas fa-chart-bar"></i> Analisis Penguasaan Materi Kubus & Balok</h3>`;
                analysisHtml += `<p style="margin-bottom:15px;color:#1e3b5a;">Perhatikan topik yang masih perlu ditingkatkan:</p>`;

                const topicEntries = Object.entries(results.topicStats);
                topicEntries.sort((a,b) => (a[1].correct/a[1].total) - (b[1].correct/b[1].total));

                topicEntries.forEach(([topicKey, stat]) => {
                    const label = topicLabels[topicKey] || topicKey;
                    const correct = stat.correct;
                    const total = stat.total;
                    const weak = correct < total;
                    const tagClass = weak ? 'weak-tag' : 'good-tag';
                    const icon = weak ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-check-circle"></i>';
                    analysisHtml += `
                        <div class="topic-item">
                            <span><strong>${label}</strong> (${correct}/${total} benar)</span>
                            <span class="${tagClass}">${icon} ${weak ? 'Perlu ditingkatkan' : 'Sudah baik'}</span>
                        </div>
                    `;
                });

                if (results.wrongDetails.length > 0) {
                    analysisHtml += `<hr><h4 style="margin:14px 0 8px; color:#153b5c;"><i class="fas fa-list-ul"></i> Soal yang Perlu Dipelajari Lagi:</h4>`;
                    results.wrongDetails.forEach(item => {
                        analysisHtml += `
                            <div style="background:#eaf0fb; border-radius:18px; padding:10px 16px; margin-bottom:10px;">
                                <strong>No. ${item.number}</strong> – ${item.question}<br>
                                <span style="color:#1e5a2e;">✔ Jawaban benar: <strong>${item.correctAnswer}</strong></span>
                            </div>
                        `;
                    });
                } else {
                    analysisHtml += `<hr><div style="text-align:center;color:#1e5a2e;font-weight:bold;margin-top:12px;">🎉 Luar biasa! Semua soal terjawab dengan benar.</div>`;
                }

                analysisContent.innerHTML = analysisHtml;
                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function allQuestionsAnswered() {
                for (let i = 0; i < questions.length; i++) {
                    if (!document.querySelector(`input[name="q${i}"]:checked`)) return false;
                }
                return true;
            }

            document.getElementById('submitBtn').addEventListener('click', function() {
                if (!allQuestionsAnswered()) {
                    alert('⚠️ Harap jawab semua 20 soal sebelum mengumpulkan!');
                    return;
                }
                const results = calculateResults();
                displayResults(results);
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                const resultPanel = document.getElementById('resultPanel');
                if (resultPanel) resultPanel.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            renderQuestions();
        })();
    </script>
</body>
</html>
