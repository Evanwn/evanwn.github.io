<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kuis ASAT Matematika Kelas 5 SD | Bangun Datar & Bangun Ruang</title>
    <!-- Font Awesome untuk ikon analisis -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f7f0e0 0%, #e8e0d0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 251, 245, 0.95);
            backdrop-filter: blur(12px);
            background: #fffef7;
            border-radius: 48px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.15), 0 8px 20px -8px rgba(89, 62, 32, 0.2);
            padding: 2.5rem 2rem;
            border: 2px solid #f3d27c;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2.2rem;
            font-weight: 700;
            color: #4b2e1a;
            margin-bottom: 0.5rem;
            background: #fceeca;
            padding: 0.8rem 1.4rem;
            border-radius: 100px;
            letter-spacing: -0.3px;
        }
        h1 i {
            color: #c9772e;
            font-size: 2.2rem;
        }

        .subtitle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 15px;
            background: #f7eedb;
            border-radius: 30px;
            padding: 0.8rem 1.8rem;
            color: #4e3a28;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .progress-badge {
            background: #d78c3b;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
        }

        .questions-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin: 1.8rem 0 2.5rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid #efdbc6;
            border-radius: 32px;
            padding: 1.4rem 1.8rem;
            box-shadow: 0 10px 18px -10px rgba(140, 90, 40, 0.1);
            transition: all 0.2s ease;
            border-left: 10px solid #ebb35c;
        }

        .question-card:hover {
            border-left-color: #c9772e;
            box-shadow: 0 16px 24px -10px rgba(180, 110, 30, 0.18);
        }

        .question-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 1.2rem;
        }
        .q-num {
            background: #b6916b;
            color: white;
            font-weight: 700;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.2rem;
        }
        .q-text {
            font-weight: 650;
            font-size: 1.18rem;
            color: #2c241a;
            flex: 1;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 5px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 16px;
            background: #fdf9f0;
            transition: background 0.15s;
            cursor: pointer;
            border: 1px solid #f1ddc0;
        }
        .option-item:hover {
            background: #fae8ce;
        }
        .option-item input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #b48b5a;
            border-radius: 50%;
            margin: 0;
            display: grid;
            place-content: center;
            cursor: pointer;
            background: white;
        }
        .option-item input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 0.15s transform ease-in-out;
            box-shadow: inset 1em 1em #c2611d;
        }
        .option-item input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn {
            border: none;
            background: #d78c3b;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.4px;
            transition: 0.2s;
            box-shadow: 0 8px 18px -6px #b57a40;
            border: 1px solid #e7a55b;
        }
        .btn:hover {
            background: #b6662c;
            box-shadow: 0 10px 20px -4px #9b5922;
        }
        .btn-outline {
            background: transparent;
            color: #5e3c1c;
            border: 2px solid #d9a066;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #f8e7d0;
            color: #3d2b17;
        }

        .result-panel {
            margin-top: 2.2rem;
            background: #faf2e2;
            border-radius: 36px;
            padding: 1.6rem 2rem;
            border: 2px dashed #c59a6b;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #7b4a1e;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .analysis-box {
            background: #fff7ea;
            border-radius: 28px;
            padding: 1.4rem;
            margin-top: 1.6rem;
            border: 1px solid #e7cd9e;
        }

        .topic-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted #d8b587;
        }
        .topic-item:last-child {
            border-bottom: none;
        }
        .weak-tag {
            background: #f7c5a8;
            color: #632c0b;
            border-radius: 25px;
            padding: 4px 18px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .good-tag {
            background: #c7e0b0;
            color: #2a4b1a;
            border-radius: 25px;
            padding: 4px 18px;
        }
        hr {
            border: 1px solid #efd6b0;
            margin: 16px 0;
        }

        @media (max-width: 550px) {
            .quiz-container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>
            <i class="fas fa-cubes"></i> Kuis ASAT Matematika
        </h1>
        <div class="subtitle">
            <span><i class="fas fa-shapes"></i> Bangun Datar & Bangun Ruang • Kelas 5 SD</span>
            <span class="progress-badge"><i class="far fa-clock"></i> 20 Soal Pilihan Ganda</span>
        </div>

        <form id="quizForm">
            <div class="questions-wrapper" id="questionsContainer">
                <!-- Soal akan dirender melalui JavaScript -->
            </div>

            <div class="btn-group">
                <button type="button" class="btn" id="submitBtn"><i class="fas fa-check-circle"></i> Kumpulkan & Lihat Skor</button>
                <button type="button" class="btn btn-outline" id="resetBtn"><i class="fas fa-redo-alt"></i> Ulangi Kuis</button>
            </div>
        </form>

        <div id="resultPanel" class="result-panel" style="display: none;">
            <div class="score-display" id="scoreText"></div>
            <div class="analysis-box" id="analysisContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---- BANK SOAL (20 soal) + kunci & topik ----
            const questions = [
                {   // 1
                    text: "Bangun ruang yang memiliki 6 sisi berbentuk persegi yang sama besar adalah …",
                    options: ["Balok", "Kubus", "Limas segi empat", "Prisma segitiga"],
                    correct: 1, // index 0-based
                    topic: "sifat-bangun-ruang"
                },
                {   // 2
                    text: "Jumlah rusuk pada bangun ruang kubus adalah …",
                    options: ["10", "12", "14", "16"],
                    correct: 1,
                    topic: "sifat-bangun-ruang"
                },
                {   // 3
                    text: "Volume kubus yang panjang rusuknya 6 cm adalah … cm³.",
                    options: ["216", "226", "246", "256"],
                    correct: 0,
                    topic: "volume-kubus-balok"
                },
                {   // 4
                    text: "Sebuah balok memiliki panjang 15 cm, lebar 7 cm, dan tinggi 11 cm. Volume balok tersebut adalah … cm³.",
                    options: ["1.155", "1.165", "1.255", "1.355"],
                    correct: 0,
                    topic: "volume-kubus-balok"
                },
                {   // 5
                    text: "Bangun datar yang memiliki 4 sisi sama panjang dan 4 sudut siku-siku disebut …",
                    options: ["Persegi panjang", "Belah ketupat", "Persegi", "Jajargenjang"],
                    correct: 2,
                    topic: "sifat-bangun-datar"
                },
                {   // 6
                    text: "Jumlah simetri lipat pada bangun persegi panjang adalah …",
                    options: ["1", "2", "3", "4"],
                    correct: 1,
                    topic: "simetri"
                },
                {   // 7
                    text: "Bangun datar yang memiliki tepat sepasang sisi sejajar disebut …",
                    options: ["Jajargenjang", "Trapesium", "Layang-layang", "Belah ketupat"],
                    correct: 1,
                    topic: "sifat-bangun-datar"
                },
                {   // 8
                    text: "Keliling persegi yang panjang sisinya 12 cm adalah … cm.",
                    options: ["24", "36", "48", "60"],
                    correct: 2,
                    topic: "keliling-luas-datar"
                },
                {   // 9
                    text: "Luas segitiga dengan alas 10 cm dan tinggi 8 cm adalah … cm².",
                    options: ["80", "40", "60", "20"],
                    correct: 1,
                    topic: "keliling-luas-datar"
                },
                {   // 10
                    text: "Sebuah taman berbentuk persegi panjang dengan panjang 20 m dan lebar 14 m. Luas taman tersebut adalah … m².",
                    options: ["280", "300", "260", "320"],
                    correct: 0,
                    topic: "keliling-luas-datar"
                },
                {   // 11
                    text: "Volume balok yang memiliki ukuran panjang 10 cm, lebar 4 cm, dan tinggi 6 cm adalah … cm³.",
                    options: ["200", "240", "260", "280"],
                    correct: 1,
                    topic: "volume-kubus-balok"
                },
                {   // 12
                    text: "Bangun ruang yang alasnya berbentuk lingkaran dan memiliki satu titik puncak adalah …",
                    options: ["Tabung", "Kerucut", "Bola", "Limas segitiga"],
                    correct: 1,
                    topic: "sifat-bangun-ruang"
                },
                {   // 13
                    text: "Banyak titik sudut pada bangun limas segi empat adalah …",
                    options: ["4", "5", "6", "8"],
                    correct: 1,
                    topic: "sifat-bangun-ruang"
                },
                {   // 14
                    text: "Luas permukaan kubus dengan panjang rusuk 5 cm adalah … cm².",
                    options: ["100", "125", "150", "200"],
                    correct: 2,
                    topic: "luas-permukaan"
                },
                {   // 15
                    text: "Sebuah akuarium berbentuk balok memiliki volume 1.800 dm³. Jika panjang 15 dm dan lebar 10 dm, maka tingginya adalah … dm.",
                    options: ["10", "12", "14", "15"],
                    correct: 1,
                    topic: "volume-kubus-balok"
                },
                {   // 16
                    text: "Bangun datar yang kedua diagonalnya saling berpotongan tegak lurus dan memiliki 4 sisi sama panjang adalah …",
                    options: ["Persegi panjang", "Belah ketupat", "Jajargenjang", "Trapesium"],
                    correct: 1,
                    topic: "sifat-bangun-datar"
                },
                {   // 17
                    text: "Keliling sebuah lingkaran dengan diameter 14 cm (π = 22/7) adalah … cm.",
                    options: ["44", "66", "88", "22"],
                    correct: 0,
                    topic: "keliling-luas-datar"
                },
                {   // 18
                    text: "Perbedaan utama antara balok dan kubus terletak pada …",
                    options: ["Jumlah rusuk", "Jumlah sisi", "Bentuk sisi-sisinya", "Jumlah titik sudut"],
                    correct: 2,
                    topic: "sifat-bangun-ruang"
                },
                {   // 19
                    text: "Luas gabungan bangun datar yang terdiri dari persegi (sisi 10 cm) dan segitiga (alas 10 cm, tinggi 6 cm) yang menempel pada salah satu sisinya adalah … cm².",
                    options: ["120", "130", "140", "160"],
                    correct: 1, // 100 + 30 = 130
                    topic: "keliling-luas-datar"
                },
                {   // 20
                    text: "Benda di sekitar kita yang menyerupai bangun ruang tabung adalah …",
                    options: ["Kotak sepatu", "Kaleng susu", "Bola basket", "Topi ulang tahun"],
                    correct: 1,
                    topic: "aplikasi-bangun-ruang"
                }
            ];

            // Topik mapping untuk analisis
            const topicLabels = {
                "sifat-bangun-datar": "Sifat Bangun Datar",
                "sifat-bangun-ruang": "Sifat Bangun Ruang",
                "simetri": "Simetri Lipat & Putar",
                "keliling-luas-datar": "Keliling & Luas Bangun Datar",
                "volume-kubus-balok": "Volume Kubus & Balok",
                "luas-permukaan": "Luas Permukaan",
                "aplikasi-bangun-ruang": "Aplikasi Bangun Ruang"
            };

            // Render soal ke HTML
            const container = document.getElementById('questionsContainer');
            function renderQuestions() {
                if (!container) return;
                let html = '';
                questions.forEach((q, idx) => {
                    html += `<div class="question-card" data-qindex="${idx}">`;
                    html += `<div class="question-header"><span class="q-num">${idx+1}</span><span class="q-text">${q.text}</span></div>`;
                    html += `<div class="options">`;
                    q.options.forEach((opt, optIdx) => {
                        html += `
                            <label class="option-item">
                                <input type="radio" name="q${idx}" value="${optIdx}">
                                <span>${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                            </label>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            }

            // Hitung skor & analisis
            function calculateResults() {
                let correctCount = 0;
                const topicStats = {}; // { topic: { total, correct } }

                // inisialisasi topik
                questions.forEach(q => {
                    if (!topicStats[q.topic]) {
                        topicStats[q.topic] = { total: 0, correct: 0 };
                    }
                    topicStats[q.topic].total++;
                });

                // periksa setiap soal
                const totalQuestions = questions.length;
                const wrongDetails = []; // untuk analisis per soal salah

                for (let i = 0; i < totalQuestions; i++) {
                    const q = questions[i];
                    const selectedRadio = document.querySelector(`input[name="q${i}"]:checked`);
                    const isCorrect = selectedRadio && parseInt(selectedRadio.value, 10) === q.correct;

                    if (isCorrect) {
                        correctCount++;
                        topicStats[q.topic].correct++;
                    } else {
                        // catat soal salah
                        wrongDetails.push({
                            number: i+1,
                            topic: q.topic,
                            question: q.text,
                            correctAnswer: q.options[q.correct]
                        });
                    }
                }

                return {
                    score: correctCount,
                    total: totalQuestions,
                    topicStats,
                    wrongDetails
                };
            }

            // Tampilkan hasil
            function displayResults(results) {
                const resultPanel = document.getElementById('resultPanel');
                const scoreText = document.getElementById('scoreText');
                const analysisContent = document.getElementById('analysisContent');
                if (!resultPanel || !scoreText || !analysisContent) return;

                resultPanel.style.display = 'block';
                const percent = Math.round((results.score / results.total) * 100);
                scoreText.innerHTML = `📊 Skor Kamu: <span style="color:#9b4b1c;">${results.score}</span> / ${results.total}  (${percent}%)`;

                // Bangun analisis per topik
                let analysisHtml = `<h3 style="margin-bottom:12px;color:#4e3622;"><i class="fas fa-chart-bar"></i> Analisis Penguasaan Materi</h3>`;
                analysisHtml += `<p style="margin-bottom:15px;color:#4b3a28;">Kamu perlu memperhatikan topik dengan performa rendah:</p>`;

                const topicEntries = Object.entries(results.topicStats);
                topicEntries.sort((a,b) => (a[1].correct/a[1].total) - (b[1].correct/b[1].total)); // terlemah di atas

                topicEntries.forEach(([topicKey, stat]) => {
                    const label = topicLabels[topicKey] || topicKey;
                    const correct = stat.correct;
                    const total = stat.total;
                    const weak = correct < total;  // jika tidak sempurna dianggap perlu perhatian
                    const tagClass = weak ? 'weak-tag' : 'good-tag';
                    const icon = weak ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-check-circle"></i>';
                    analysisHtml += `
                        <div class="topic-item">
                            <span><strong>${label}</strong> (${correct}/${total} benar)</span>
                            <span class="${tagClass}">${icon} ${weak ? 'Perlu ditingkatkan' : 'Sudah baik'}</span>
                        </div>
                    `;
                });

                // Daftar soal yang salah
                if (results.wrongDetails.length > 0) {
                    analysisHtml += `<hr><h4 style="margin:14px 0 8px; color:#5e3c1c;"><i class="fas fa-list-ul"></i> Soal yang Perlu Dipelajari Lagi:</h4>`;
                    results.wrongDetails.forEach(item => {
                        analysisHtml += `
                            <div style="background:#fceee0; border-radius:18px; padding:10px 16px; margin-bottom:10px;">
                                <strong>No. ${item.number}</strong> – ${item.question}<br>
                                <span style="color:#2e5c1e;">✔ Jawaban benar: <strong>${item.correctAnswer}</strong></span>
                            </div>
                        `;
                    });
                } else {
                    analysisHtml += `<hr><div style="text-align:center;color:#2c5e2e;font-weight:bold;margin-top:12px;">🎉 Luar biasa! Semua soal terjawab dengan benar.</div>`;
                }

                analysisContent.innerHTML = analysisHtml;
                // Scroll ke hasil
                resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Validasi apakah semua soal terjawab
            function allQuestionsAnswered() {
                for (let i = 0; i < questions.length; i++) {
                    const selected = document.querySelector(`input[name="q${i}"]:checked`);
                    if (!selected) return false;
                }
                return true;
            }

            // Event handler
            document.getElementById('submitBtn').addEventListener('click', function() {
                if (!allQuestionsAnswered()) {
                    alert('⚠️ Harap jawab semua 20 soal sebelum mengumpulkan!');
                    return;
                }
                const results = calculateResults();
                displayResults(results);
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                // Reset semua pilihan radio
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                // Sembunyikan panel hasil
                const resultPanel = document.getElementById('resultPanel');
                if (resultPanel) resultPanel.style.display = 'none';
                // Scroll ke atas kuis
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Inisialisasi render soal
            renderQuestions();
        })();
    </script>
</body>
</html>
